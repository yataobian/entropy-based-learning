name: Render and Publish Book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to push the rendered site to the gh-pages branch
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required to recover each file's last commit time
          fetch-depth: 0

      - name: Restore file modification times from git history
        # By default a fresh checkout sets every file's mtime to the checkout
        # time, which would make `date-modified: last-modified` show the deploy
        # date. This restores each file's mtime to its last git commit time.
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Require the locally built book PDF
        # The print PDF is compiled on the author's machine (TeX Live +
        # fonts) and committed to assets/. CI only publishes that file.
        run: |
          test -f assets/Entropy-Based-Learning.pdf
          echo "PDF present ($(du -h assets/Entropy-Based-Learning.pdf | awk '{print $1}'))"

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
