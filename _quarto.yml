project:
  type: book
  output-dir: _book

book:
  title: "Entropy-Based Learning"
  subtitle: "Principles, Methods, and Scientific Applications"
  author: "Yatao Bian"
  date: "2026-08-02"
  description: >
    An introduction to modern entropy- and energy-based learning, spanning the
    maximum-entropy, minimum-entropy, and minimax-entropy principles, and
    their applications to scientific and reasoning-oriented AI.
  site-url: "https://yataobian.com/"
  repo-url: "https://github.com/yataobian/entropy-based-learning"
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Part I — Foundations"
      chapters:
        - chapters/01-entropy.qmd
        - chapters/02-free-energy.qmd
        - chapters/03-energy-models.qmd
    - part: "Part II — Methods"
      chapters:
        - chapters/04-max-entropy.qmd
        - chapters/05-min-entropy.qmd
        - chapters/06-minimax-entropy.qmd
        - chapters/07-energy-reasoning.qmd
    - part: "Part III — Applications"
      chapters:
        - chapters/08-ai-for-science.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-title: "On This Page"
    code-fold: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  error: false
