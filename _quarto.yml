project:
  type: book
  output-dir: _book
  resources:
    - assets/Entropy-Based-Learning.pdf
  post-render:
    - scripts/place-site-pdf.sh

book:
  title: "Entropy-Based Learning"
  subtitle: "Principles, Methods, and Scientific Applications"
  author: "Yatao Bian"
  date: "2026-08-02"
  description: >
    An introduction to modern entropy- and energy-based learning, spanning the
    maximum-entropy, minimum-entropy, and minimax-entropy principles, and
    their applications to scientific and reasoning-oriented AI.
  site-url: "https://yataobian.github.io/entropy-based-learning/"
  repo-url: "https://github.com/yataobian/entropy-based-learning"
  output-file: "Entropy-Based-Learning"
  downloads: [pdf]

# Chapter lists live in the profile files. Quarto concatenates arrays
# across a profile and this file, so a profile cannot drop contents.qmd
# while the list is also written here. `site` is the default (HTML).
# `pdf` is option 1 of scripts/render-pdf.sh; `pdf2` is option 2.
profile:
  group:
    - [site, pdf, pdf2]

bibliography: references.bib

language:
  title-block-published: "Released"
  title-block-modified: "Last updated"

citation:
  id: bian2026entropy
  type: book
  title: "Entropy-Based Learning"
  author: "Yatao Bian"
  issued: 2026
  publisher: "Blue Whale Lab"
  url: "https://yataobian.github.io/entropy-based-learning/"
google-scholar: true

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-title: "On This Page"
    code-fold: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  error: false
