# Quarto profile: `quarto render --profile pdf --to pdf`
# Option 1 of scripts/render-pdf.sh (KOMA-Script, TeX Gyre Pagella, LuaLaTeX).
# Option 2 is the `pdf2` profile. Keep this chapter list identical to
# _quarto-site.yml. Default `quarto render` stays HTML (the `site` profile).

project:
  output-dir: _book-pdf
  resources:
    - cover.png

book:
  chapters:
    - index.qmd
    - contents.qmd
    - 01-intro.qmd
    - part: "Part I — Foundations"
      chapters:
        - chapters/02-entropy.qmd
        - chapters/03-free-energy.qmd
        - chapters/04-energy-models.qmd
    - part: "Part II — Methods"
      chapters:
        - chapters/05-max-entropy.qmd
        - chapters/06-min-entropy.qmd
        - chapters/07-minimax-entropy.qmd
        - chapters/08-energy-reasoning.qmd
        - chapters/09-max-entropy-post-training.qmd
        - chapters/10-free-energy-principle.qmd
    - part: "Part III — Applications"
      chapters:
        - chapters/11-ai-for-science.qmd
    - summary.qmd
    - references.qmd

format:
  pdf:
    documentclass: scrbook
    classoption:
      - oneside
      - open=any
      - numbers=noenddot
      - fontsize=11pt
    pdf-engine: lualatex
    # The detailed Contents page is contents.qmd (also included in
    # the preface and the introduction). Do not also emit a generated TOC.
    toc: false
    toc-depth: 3
    lot: false
    lof: false
    number-sections: true
    papersize: a4
    geometry:
      - top=24mm
      - bottom=24mm
      - left=26mm
      - right=26mm
    linestretch: 1.18
    mainfont: "TeX Gyre Pagella"
    sansfont: "TeX Gyre Heros"
    monofont: "Latin Modern Mono"
    colorlinks: true
    fig-align: center
    fig-pos: "H"
    keep-tex: false
    cite-method: citeproc
    link-citations: true
    filters:
      - filters/svg-to-pdf.lua
    include-in-header:
      - tex/book-pdf-header.tex
      - tex/book-pdf-titlepage.tex
    header-includes:
      - \usepackage{float}
