# Quarto profile: `quarto render --profile pdf2 --to pdf`
# Option 2 of scripts/render-pdf.sh.
# Same manuscript, set in the type of the FEP research note:
# XeLaTeX, STIXGeneral, STIX Two Math, article-like margins,
# and a generated contents (the handwritten contents.qmd is omitted).
# scripts/render-pdf.sh --style 2 copies the result over
# assets/Entropy-Based-Learning.pdf, the file the site publishes.

project:
  output-dir: _book-pdf-stix
  resources:
    - cover.png

book:
  chapters:
    - index.qmd
    - 01-intro.qmd
    - part: "Part I — Foundations"
      chapters:
        - chapters/02-entropy.qmd
        - chapters/03-free-energy.qmd
        - chapters/04-energy-models.qmd
    - part: "Part II — Methods"
      chapters:
        - chapters/05-max-entropy.qmd
        - chapters/06-min-entropy.qmd
        - chapters/07-minimax-entropy.qmd
        - chapters/08-energy-reasoning.qmd
        - chapters/09-max-entropy-post-training.qmd
    - part: "Part III — Applications"
      chapters:
        - chapters/10-ai-for-science.qmd
    - summary.qmd
    - references.qmd

format:
  pdf:
    documentclass: scrbook
    classoption:
      - oneside
      - open=any
      - numbers=noenddot
      - fontsize=11pt
    pdf-engine: xelatex
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    lot: false
    lof: false
    number-sections: true
    papersize: a4
    geometry:
      - top=2.3cm
      - bottom=2.3cm
      - left=2.2cm
      - right=2.2cm
    linestretch: 1.05
    mainfont: "STIXGeneral"
    sansfont: "STIXGeneral"
    mathfont: "STIX Two Math"
    colorlinks: true
    fig-align: center
    fig-pos: "H"
    keep-tex: false
    cite-method: citeproc
    link-citations: true
    filters:
      - filters/svg-to-pdf.lua
    include-in-header:
      - tex/book-pdf-stix.tex
